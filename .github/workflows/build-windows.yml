name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Run database and archive tests
        run: python -m unittest discover -s tests -v
      - name: Create Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name IndexUniversal --collect-all fitz main.py
      - name: Publish EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndexUniversal-Windows-EXE
          path: dist/IndexUniversal.exe
          if-no-files-found: error
          retention-days: 30
